name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest pixora/tests/ -v --tb=short

      - name: Import check
        run: python -c "from pixora.api.main import app; print(f'OK: {len(app.routes)} routes')"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pixora:ci .

      - name: Test Docker image
        run: |
          docker run -d --name pixora-test -p 8000:8000 pixora:ci
          sleep 5
          curl -f http://localhost:8000/api/v1/health || exit 1
          docker stop pixora-test
