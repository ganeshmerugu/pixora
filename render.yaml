services:
  - type: web
    name: pixora
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PIXORA_DEPLOYMENT_MODE
        value: serverless
      - key: PIXORA_DEFAULT_TIER
        value: "1"
      - key: PIXORA_BUDGET_LIMIT_USD
        value: "1.0"
      - key: PIXORA_TLS_VERIFY
        value: "false"
      - key: PIXORA_GEMINI_API_KEY
        sync: false
      - key: PIXORA_JWT_SECRET
        generateValue: true
      - key: PIXORA_GROQ_API_KEY
        sync: false
      - key: PIXORA_TOGETHER_API_KEY
        sync: false
    healthCheckPath: /api/v1/health
    autoDeploy: true
